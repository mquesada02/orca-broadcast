name: Feature request
description: Suggest a change or a new feature.
body:
  - type: markdown
    attributes:
      value: Check the folder [`.out-of-scope/`](https://github.com/mquesada02/orca-broadcast/tree/main/.out-of-scope) first. It lists the ideas that the project rules out.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, or what is hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should orca-broadcast do instead?
    validations:
      required: true
